name: Sync to Hugging Face hub

# This repo had no sync workflow, so the Space was only ever updated by hand.
# It was therefore still running the pre-migration code (Cerebras, which now
# returns payment_required for every request) even after the fix was pushed
# here. This keeps the Space in step with `main` automatically.
#
# Requires an HF_TOKEN secret on this repository:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#   Name: HF_TOKEN   Value: a Hugging Face access token with write scope

on:
  push:
    branches: [main]

  # Allows re-running the sync by hand from the Actions tab.
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push backend to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

          # The Space expects the Dockerfile at its root, and this repo keeps
          # it under backend/, so publish only that subtree.
          git subtree split --prefix=backend -b hf-deploy

          git push -f \
            "https://ArifAntarctic7:$HF_TOKEN@huggingface.co/spaces/ArifAntarctic7/contract-iq" \
            hf-deploy:main
